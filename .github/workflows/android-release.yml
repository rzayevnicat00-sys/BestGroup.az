name: Build and Release BestGroup.az Android App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-artifacts
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" build-artifacts/BestGroup.az.apk
          else
            find . -name "*.apk" -exec cp {} build-artifacts/BestGroup.az.apk \;
          fi
          ls -la build-artifacts/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BestGroup.az-apk
          path: build-artifacts/BestGroup.az.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: BestGroup.az Mobil Tətbiqi (Son Versiya)
          tag_name: latest
          body: |
            ## BestGroup.az Android Tətbiqi

            BestGroup.az mobil tətbiqinin ən son rəsmi versiyası hazırdır.

            ### 📲 Quraşdırma təlimatı:
            1. Aşağıdakı **`BestGroup.az.apk`** faylını birbaşa Android telefonunuza yükləyin.
            2. Yükləmə tamamlandıqda faylı açıb quraşdırın ("Naməlum mənbələrdən quraşdırmaya icazə ver" seçimini aktiv edin).
            3. Tətbiqi açıb mövcud hesabınızla daxil olun.

            **Dəstək:** support@bestgroup.az | https://bestgroup.az
          files: build-artifacts/BestGroup.az.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
