name: Build and Release BestGroup.az Android App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 1.0.1)'
        required: false
        default: '1.0.1'
      release_notes:
        description: 'Release Notes (optional)'
        required: false
        default: 'BestGroup.az yenilənmiş versiya və təkmilləşdirmələr.'

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Rename APK Artifact
        run: |
          mkdir -p build-artifacts
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/BestGroup.az.apk
          elif [ -f "BestGroup.az.apk" ]; then
            cp BestGroup.az.apk build-artifacts/BestGroup.az.apk
          else
            find . -name "*.apk" -exec cp {} build-artifacts/BestGroup.az.apk \;
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BestGroup.az-apk
          path: build-artifacts/BestGroup.az.apk
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: BestGroup.az ${{ github.ref_name || github.event.inputs.version_name }}
          tag_name: ${{ github.ref_name || format('v{0}', github.event.inputs.version_name) }}
          body: |
            ## BestGroup.az Android Tətbiqi Yenilənməsi
            
            ${{ github.event.inputs.release_notes || 'BestGroup.az mobil tətbiqinin yeni versiyası hazırdır. Yeniliklər və performans təkmilləşdirmələri əlavə olunub.' }}
            
            ### Quraşdırma təlimatı:
            1. Aşağıdakı `BestGroup.az.apk` faylını yükləyin.
            2. Android cihazınızda quraşdırmaya icazə verin və açın.
            3. Mövcud hesabınızla daxil olun və ya qeydiyyatdan keçin.
            
            **Dəstək:** support@bestgroup.az | https://bestgroup.az
          files: build-artifacts/BestGroup.az.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
